# ⚠️ ARCHIVO SOLO PARA DESPLIEGUE A AWS REAL ⚠️
# Este archivo de configuración del Serverless Framework NO se usa en el entorno local.
# El despliegue local se realiza mediante:
#   docker-compose up -d
#   scripts/ministack-bootstrap.sh   (crea los recursos y la API Gateway REST v1 real en MiniStack)
#
# Para AWS real: `serverless deploy --stage prod`
# Para local:  Ver README.md → "Opción A: Con Docker + MiniStack"
#
# ⚠️ ARCHIVO SOLO PARA DESPLIEGUE A AWS REAL ⚠️

service: serverless-order-pipeline

frameworkVersion: "3"

plugins:
  - serverless-step-functions
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  tracing:
    lambda: true
    apiGateway: true
  logRetentionInDays: 14
  environment:
    ORDERS_TABLE: ${self:service}-orders-${self:provider.stage}
    INVENTORY_TABLE: ${self:service}-inventory-${self:provider.stage}
    RESERVATIONS_TABLE: ${self:service}-reservations-${self:provider.stage}
    POWERTOOLS_SERVICE_NAME: order-pipeline
    POWERTOOLS_METRICS_NAMESPACE: OrderPipeline
    # Emulator override: container sets ORDER_QUEUE_URL (MiniStack). Middle-ground
    # default keeps real AWS deploy correct without !Ref (offline resolves the
    # SQS Ref with a placeholder account that MiniStack cannot match).
    ORDER_QUEUE_URL: ${env:ORDER_QUEUE_URL, 'https://sqs.${self:provider.region}.amazonaws.com/123456789012/${self:service}-order-queue-${self:provider.stage}'}
    NOTIFICATIONS_TOPIC_ARN: !Ref OrderNotificationsTopic
    STATE_MACHINE_ARN: !Ref OrderFulfillmentStateMachine
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt OrdersTable.Arn
            - !GetAtt InventoryTable.Arn
            - !GetAtt ReservationsTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !GetAtt OrderQueue.Arn
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: !Ref OrderNotificationsTopic
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource: !Ref OrderFulfillmentStateMachine

functions:
  # 1. Entry point: HTTP POST /orders -> writes PENDING order, pushes to SQS
  createOrder:
    handler: src/handlers/createOrder.handler
    events:
      - httpApi:
          path: /orders
          method: post

  # 1b. Read side: HTTP GET /orders/{orderId} -> current order state
  getOrder:
    handler: src/handlers/getOrder.handler
    events:
      - httpApi:
          path: /orders/{orderId}
          method: get

  # 2. SQS consumer: starts the Step Functions execution
  processOrder:
    handler: src/handlers/processOrder.handler
    timeout: 30
    events:
      - sqs:
          arn: !GetAtt OrderQueue.Arn
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  # 3-7. Individual steps of the state machine (each one is its own Lambda,
  # which is the pattern most commonly evaluated in interviews: single-purpose functions)
  validateStock:
    handler: src/handlers/validateStock.handler

  reserveInventory:
    handler: src/handlers/reserveInventory.handler

  chargePayment:
    handler: src/handlers/chargePayment.handler

  confirmOrder:
    handler: src/handlers/confirmOrder.handler

  notifyCustomer:
    handler: src/handlers/notifyCustomer.handler

  cancelOrder:
    handler: src/handlers/cancelOrder.handler

stepFunctions:
  stateMachines:
    orderFulfillment:
      id: OrderStateMachine
      name: OrderFulfillmentStateMachine
      tracingConfig:
        enabled: true
      definition:
        Comment: "Order fulfillment workflow: stock -> inventory -> payment -> confirm -> notify"
        StartAt: ValidateStock
        States:
          ValidateStock:
            Type: Task
            Resource: !GetAtt validateStock.Arn
            Retry: &transientRetry
              - ErrorEquals:
                  - Lambda.ClientExecutionTimeoutException
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch: &catchAll
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: CancelOrder
            Next: ReserveInventory
          ReserveInventory:
            Type: Task
            Resource: !GetAtt reserveInventory.Arn
            Retry: *transientRetry
            Catch:
              - ErrorEquals: ["OutOfStock"]
                ResultPath: "$.error"
                Next: CancelOrder
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: CancelOrder
            Next: ChargePayment
          ChargePayment:
            Type: Task
            Resource: !GetAtt chargePayment.Arn
            Retry: *transientRetry
            Catch: *catchAll
            Next: ConfirmOrder
          ConfirmOrder:
            Type: Task
            Resource: !GetAtt confirmOrder.Arn
            Retry: *transientRetry
            Catch: *catchAll
            Next: NotifyCustomer
          NotifyCustomer:
            Type: Task
            Resource: !GetAtt notifyCustomer.Arn
            End: true
          CancelOrder:
            Type: Task
            Resource: !GetAtt cancelOrder.Arn
            End: true

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ORDERS_TABLE}
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    InventoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-inventory-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sku
            AttributeType: S
        KeySchema:
          - AttributeName: sku
            KeyType: HASH

    ReservationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-reservations-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH

    OrderQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-order-queue-${self:provider.stage}
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
          maxReceiveCount: 3

    OrdersDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-order-queue-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    OrderNotificationsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-notifications-${self:provider.stage}

    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-alarms-${self:provider.stage}
        Subscription:
          - Protocol: email
            Endpoint: ${env:ALARM_EMAIL, 'alerts@example.com'}

    DlqNotEmptyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-dlq-not-empty
        AlarmDescription: Messages are stuck in the orders DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt OrdersDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    CreateOrderErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-create-order-errors
        AlarmDescription: createOrder is failing
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:provider.stage}-createOrder
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    WorkflowFailedAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-workflow-failed
        AlarmDescription: Order workflow executions are failing
        Namespace: AWS/States
        MetricName: ExecutionsFailed
        Dimensions:
          - Name: StateMachineArn
            Value: !Ref OrderStateMachine
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]
custom:
  # En local no se usa este archivo: `scripts/ministack-bootstrap.sh` provisiona
  # todo directo contra MiniStack (:4566), incluida una API Gateway REST v1 real
  # (POST /orders → createOrder) creada por control-plane con la AWS CLI.
  # serverless.yml es solo para AWS real, donde API Gateway la despliega el propio framework.
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    noPrependStageInUrl: true
